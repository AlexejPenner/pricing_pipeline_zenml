# Pipeline-level configuration
enable_cache: True
enable_step_logs: True
enable_artifact_metadata: True
enable_artifact_visualization: True

# Pipeline parameters
parameters:
  epochs: 10
  n_samples: 11000
  country: ""

# Model configuration
model:
  name: "PricePredictionModel"
  description: "End-to-end pipeline for price prediction."

# Docker settings
settings:
  docker:
    requirements: "requirements.txt"
    python_package_installer: "uv"

# Step-specific configuration
steps:
  load_data:
    enable_cache: True

  analyze_data:
    enable_cache: False

  filter_by_country:
    enable_cache: True

  clean_data:
    enable_cache: True

  train_model:
    docker:
      requirements: "requirements_gpu.txt"
      python_package_installer: "uv"
    enable_cache: False

  generate_data_analysis_report:
    enable_cache: False