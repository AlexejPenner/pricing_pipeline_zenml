# Configuration for drift detection with significant drift scenario
# This configuration demonstrates drift monitoring when actual data drift is detected

# Pipeline-level configuration
enable_cache: True
enable_step_logs: True
enable_artifact_metadata: True
enable_artifact_visualization: True

# Pipeline parameters - drift detection enabled with simulated drift
parameters:
  epochs: 15
  n_samples: 10000
  country: "Germany"  # Different country for more realistic drift scenario
  detect_drift: True
  simulate_drift: True  # Enable drift simulation to trigger detection

# Model configuration
model:
  name: "PricePredictionModel_WithDrift"
  description: "Price prediction model demonstrating drift detection when data drift occurs."
  version: "2.0.0"
  license: "MIT"
  tags:
    - drift_detection
    - monitoring
    - data_quality
    - drift_scenario
    - alert_condition

# Docker settings
settings:
  docker:
    requirements: "requirements.txt"
    python_package_installer: "uv"

# Step-specific configuration optimized for drift detection
steps:
  load_reference_data:
    enable_cache: True
    
  load_current_data:
    enable_cache: False  # Don't cache when simulating drift
    
  analyze_data:
    enable_cache: False
    
  filter_by_country:
    enable_cache: True
    
  clean_data:
    enable_cache: True
    
  train_model:
    docker:
      requirements: "requirements_gpu.txt"
      python_package_installer: "uv"
    enable_cache: False
    experiment_tracker: True  # Track experiments when drift occurs
    
  generate_data_analysis_report:
    enable_cache: False
    
  drift_detection_step:
    enable_cache: False  # Always fresh drift analysis
    experiment_tracker: True
    
# Additional configuration for drift detection with stricter thresholds
drift_detection:
  enabled: True
  thresholds:
    data_drift_score: 0.3  # Higher threshold - expect significant drift
    target_drift_score: 0.25
    feature_drift_score: 0.3
  
  monitoring:
    save_reports: True
    alert_on_drift: True  # Enable alerts when drift is detected
    
  evidently_config:
    color_scheme: "default"
    reference_period: "30d"
    comparison_period: "7d"
    
  # Drift simulation configuration - matches the drift_config in utils.py
  drift_simulation:
    enabled: True
    time_factor: 1.0  # Full drift effect
    price_multipliers:
      Electronics: 1.3  # 30% price increase
      Clothing: 1.1     # 10% price increase
      Books: 0.9        # 10% price decrease
      Home: 1.05        # 5% price increase
      Sports: 0.95      # 5% price decrease
    category_shift:
      Electronics: 0.35  # Increase from 20% to 35% market share
      Books: 0.1         # Decrease from 20% to 10% market share
      Clothing: 0.15     # Decrease from 20% to 15%
      Home: 0.25         # Increase from 20% to 25%
      Sports: 0.15       # Decrease from 20% to 15%

# Resource settings for handling larger datasets during drift analysis
resources:
  cpu_count: 4
  memory: "8GB"
  
# Alerting configuration
alerting:
  enabled: True
  channels:
    - slack
    - email
  conditions:
    - drift_score_exceeds_threshold
    - target_drift_detected
    - feature_importance_changed