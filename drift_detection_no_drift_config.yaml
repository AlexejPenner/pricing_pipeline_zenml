# Configuration for drift detection with no drift scenario
# This configuration shows successful drift monitoring where no significant drift is detected

# Pipeline-level configuration
enable_cache: True
enable_step_logs: True
enable_artifact_metadata: True
enable_artifact_visualization: True

# Pipeline parameters - drift detection enabled but no simulated drift
parameters:
  epochs: 12
  n_samples: 8000
  country: "USA"
  detect_drift: True
  simulate_drift: False  # No drift simulation - clean comparison

# Model configuration
model:
  name: "PricePredictionModel_NoDrift"
  description: "Price prediction model with successful drift detection - no drift scenario."
  version: "1.0.0"
  license: "MIT"
  tags:
    - drift_detection
    - monitoring
    - production_ready
    - no_drift_scenario

# Docker settings
settings:
  docker:
    requirements: "requirements.txt"
    python_package_installer: "uv"

# Step-specific configuration optimized for drift detection
steps:
  load_reference_data:
    enable_cache: True
    
  load_current_data:
    enable_cache: True
    
  analyze_data:
    enable_cache: False
    
  filter_by_country:
    enable_cache: True
    
  clean_data:
    enable_cache: True
    
  train_model:
    docker:
      requirements: "requirements_gpu.txt"
      python_package_installer: "uv"
    enable_cache: False
    
  generate_data_analysis_report:
    enable_cache: False
    
  drift_detection_step:
    enable_cache: False  # Always fresh drift analysis
    experiment_tracker: True
    
# Additional configuration for drift detection
drift_detection:
  enabled: True
  thresholds:
    data_drift_score: 0.1  # Conservative threshold - minimal drift expected
    target_drift_score: 0.05
    feature_drift_score: 0.1
  
  monitoring:
    save_reports: True
    alert_on_drift: False  # No alerts expected in this scenario
    
  evidently_config:
    color_scheme: "default"
    reference_period: "30d"
    comparison_period: "7d"