# Pipeline-level configuration
enable_cache: True
enable_step_logs: True
enable_artifact_metadata: True
enable_artifact_visualization: True

# Pipeline parameters
parameters:
  epochs: 10
  n_samples: 11000
  country: ""

# Model configuration
model:
  name: "PricePrediction"
  description: "End-to-end pipeline for price prediction."

# Docker settings
settings:
  orchestrator.databricks:
    node_type_id: "Standard_D4s_v4"
    spark_version: "14.3.x-scala2.12"
    autoscale:
      - 1
      - 1
  docker:
    requirements: "requirements.txt"
    python_package_installer: "uv"

# Step-specific configuration
steps:
  load_data:
    enable_cache: False

  analyze_data:
    enable_cache: False

  filter_by_country:
    enable_cache: True

  clean_data:
    enable_cache: True

  train_model:
    docker:
      requirements: "requirements_gpu.txt"
      python_package_installer: "uv"
      build_config:
        build_options:
          --platform linux/amd64
    enable_cache: False

  generate_data_analysis_report:
    enable_cache: False